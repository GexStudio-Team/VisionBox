services:
  database:
    image: postgres:17-alpine
    container_name: visionbots-postgres
    environment:
      POSTGRES_DB: visionbots
      POSTGRES_USER: visionbots
      POSTGRES_PASSWORD: visionbots_dev
    ports:
      - "5432:5432"
    volumes:
      - visionbots_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionbots -d visionbots"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  visionbots_postgres_data:
